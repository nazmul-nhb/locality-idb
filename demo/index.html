<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/src/style.css" />
		<title>Locality IDB — API Lab</title>
	</head>
	<body>
		<div id="app"></div>
		<dialog id="confirmDialog" class="dialog">
			<form method="dialog" class="dialog-card">
				<div class="dialog-icon">!</div>
				<h2 id="dialogTitle">Confirm action</h2>
				<p id="dialogDescription"></p>
				<div class="dialog-actions">
					<button type="submit" class="button button-quiet" value="cancel">Cancel</button>
					<button type="submit" id="dialogConfirm" class="button button-danger" value="confirm">Continue</button>
				</div>
			</form>
		</dialog>
		<div id="toastRegion" class="toast-region" aria-live="polite"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
